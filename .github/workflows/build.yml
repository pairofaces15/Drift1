name: Build IPA v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find the game and put it where it belongs
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            F=$(find . -name 'index.html' -not -path './www/*' | head -1)
            if [ -z "$F" ]; then
              F=$(find . -name '*.html' | head -1)
            fi
            echo "using $F"
            cp "$F" www/index.html
          fi
          ls -la www/

      - name: Write the project files
        run: |
          cat > package.json <<'JSON'
          {
            "name": "bristol-bay-drift",
            "version": "1.0.0",
            "private": true,
            "devDependencies": { "@capacitor/cli": "^6.1.2" },
            "dependencies": {
              "@capacitor/core": "^6.1.2",
              "@capacitor/ios": "^6.1.2"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.bristolbay.drift",
            "appName": "Bristol Bay Drift",
            "webDir": "www",
            "ios": {
              "contentInset": "never",
              "backgroundColor": "#05090C"
            }
          }
          JSON

      - name: Install Capacitor
        run: npm install

      - name: Create the iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Portrait, fullscreen, dark
        run: |
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $PL || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Drift" $PL || true

      - name: Build without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package the .ipa
        run: |
          mkdir -p out/Payload
          cp -r build/Build/Products/Release-iphoneos/App.app out/Payload/
          cd out && zip -qry BristolBayDrift.ipa Payload
          ls -lh BristolBayDrift.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BristolBayDrift-ipa
          path: out/BristolBayDrift.ipa
